spring.application.name=genifit

server.port=${PORT:8080}
server.forward-headers-strategy=framework
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://genifit-production.up.railway.app,https://*.vercel.app,https://*.netlify.app}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.retry-attempts=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

gemini.api-key=${GEMINI_API_KEY}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent}
gemini.max-history=${GEMINI_MAX_HISTORY:5}
gemini.model=gemini-2.0-flash

# Resilience4j Retry
resilience4j.retry.instances.gemini.max-attempts=3
resilience4j.retry.instances.gemini.wait-duration=2s
resilience4j.retry.instances.gemini.enable-exponential-backoff=true
resilience4j.retry.instances.gemini.exponential-backoff-multiplier=2.0

resilience4j.retry.instances.gemini.retry-exceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}
jwt.signerKey=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

google.client.id=${GOOGLE_CLIENT_ID}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GOOGLE_MAIL}
spring.mail.password=${GOOGLE_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.api-url=https://test-payment.momo.vn/v2/gateway/api/create
momo.ipn-url=${MOMO_IPN_URL}
momo.redirect-url=${MOMO_REDIRECT_URL}

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.redirect-url=${VNPAY_REDIRECT_URL}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.currency-code=VND
vnpay.locale=vn
vnpay.order-type=other

momo.refund-url=https://test-payment.momo.vn/v2/gateway/api/refund

