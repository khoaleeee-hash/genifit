spring.application.name=genifit

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

gemini.api-key=${GEMINI_API_KEY}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent}
gemini.max-history=${GEMINI_MAX_HISTORY:20}
gemini.model=gemini-3.5-flash

# Resilience4j Retry
resilience4j.retry.instances.gemini.max-attempts=3
resilience4j.retry.instances.gemini.wait-duration=2s
resilience4j.retry.instances.gemini.enable-exponential-backoff=true
resilience4j.retry.instances.gemini.exponential-backoff-multiplier=2.0

resilience4j.retry.instances.gemini.retry-exceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}
jwt.signerKey=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

google.client.id=${GOOGLE_CLIENT_ID}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GOOGLE_MAIL}
spring.mail.password=${GOOGLE_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true